name: "🐞 گزارش خطا"
description: "گزارش مشکل قابل بازتولید در نسخه ویندوز"
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        ممنون از گزارش شما. Issue عمومی است؛ لطفاً تصویر وب‌کم، چهره، اطلاعات خصوصی، رمز عبور و فایل محرمانه ارسال نکنید.
  - type: input
    id: version
    attributes:
      label: "نسخه PostureCoach"
      placeholder: "مثلاً 2.1.8"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: "نسخه Windows"
      placeholder: "مثلاً Windows 11 x64"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "مراحل بازتولید مشکل"
      description: "گام‌ها را به ترتیب بنویسید."
      placeholder: "۱. برنامه را اجرا کردم...\n۲. دوربین را فعال کردم..."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "چه اتفاقی افتاد؟"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "انتظار داشتید چه اتفاقی بیفتد؟"
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: "بخش دارای مشکل"
      options:
        - "دوربین / وضعیت نشستن"
        - "آواتار دسکتاپ"
        - "تمرین‌ها و انیمیشن‌ها"
        - "اعلان‌ها و تایمر"
        - "اجرا / بسته‌بندی"
        - "سایر"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: "حریم خصوصی"
      options:
        - label: "اطمینان دارم گزارش حاوی تصویر چهره یا داده خصوصی نیست."
          required: true
