name: Mark v2.1.8 as pre-release archive

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/label-legacy-218.yml

permissions:
  contents: write

jobs:
  label-legacy:
    if: github.repository == 'hgolmohammadi/posture-coach-releases'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark historical pre-launch release as pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_before="$(gh api repos/"$GITHUB_REPOSITORY"/releases/latest --jq .tag_name)"
          test "$latest_before" = 'v1.0.0'

          gh release edit v2.1.8 --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title 'PostureCoach v2.1.8 — نسخه آزمایشی قدیمی (پیش از انتشار رسمی 1.0.0)'

          legacy_is_prerelease="$(gh api repos/"$GITHUB_REPOSITORY"/releases/tags/v2.1.8 --jq .prerelease)"
          latest_after="$(gh api repos/"$GITHUB_REPOSITORY"/releases/latest --jq .tag_name)"
          test "$legacy_is_prerelease" = 'true'
          test "$latest_after" = 'v1.0.0'
          echo 'LEGACY_218_PRERELEASE_CONFIRMED=true'
          echo 'OFFICIAL_LATEST=v1.0.0'
