name: Sync v2.1.8 release notes RTL

on:
  push:
    branches: [main]
    paths:
      - docs/releases/v2.1.8-rtl.html
      - .github/workflows/sync-release-notes-218.yml

permissions:
  contents: write

jobs:
  release-notes:
    if: github.repository == 'hgolmohammadi/posture-coach-releases'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Sync right-to-left Persian release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v2.1.8 --repo "$GITHUB_REPOSITORY" --notes-file docs/releases/v2.1.8-rtl.html
